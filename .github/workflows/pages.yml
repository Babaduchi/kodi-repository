name: Publish Kodi repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kodi-repository-pages
  cancel-in-progress: true

jobs:
  build-chibi-club:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Babaduchi/kodi-chibi-club
          ref: main
          path: sources/visualization.chibiclub
      - uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: Omega
          path: kodi
      - name: Register visualization add-on
        shell: pwsh
        run: |
          $definition = "kodi/cmake/addons/addons/visualization.chibiclub"
          New-Item -ItemType Directory -Force -Path $definition | Out-Null
          "visualization.chibiclub unused" |
            Set-Content "$definition/visualization.chibiclub.txt"
      - name: Configure Chibi Club
        shell: pwsh
        run: |
          cmake -S kodi/cmake/addons -B build/chibi-club `
            -G "Visual Studio 17 2022" -A x64 `
            "-DADDONS_TO_BUILD=visualization.chibiclub" `
            "-DADDON_SRC_PREFIX=$env:GITHUB_WORKSPACE/sources" `
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/staging" `
            "-DPACKAGE_ZIP=1"
      - name: Build Chibi Club
        run: cmake --build build/chibi-club --config Release
      - name: Verify compiled add-on
        shell: pwsh
        run: |
          $addon = "staging/visualization.chibiclub"
          if (-not (Test-Path "$addon/addon.xml")) {
            throw "Compiled Chibi Club addon.xml was not installed"
          }
          $dll = Get-ChildItem -Path $addon -Recurse -Filter "*.dll"
          if (-not $dll) {
            throw "Compiled Chibi Club DLL was not installed"
          }
          Write-Host "Compiled:" $dll.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: visualization.chibiclub-windows-x64
          path: staging/visualization.chibiclub
          if-no-files-found: error

  publish:
    needs: build-chibi-club
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Babaduchi/ersatztv-kodi
          ref: agent/compile-ersatztv-kodi
          path: sources/ersatztv-kodi
      - uses: actions/checkout@v4
        with:
          repository: Babaduchi/multi-update-kodi
          ref: main
          path: sources/multi-update-kodi
      - uses: actions/checkout@v4
        with:
          repository: Babaduchi/radio-generator-kodi
          ref: main
          path: sources/radio-generator-kodi
      - uses: actions/download-artifact@v4
        with:
          name: visualization.chibiclub-windows-x64
          path: sources/chibi-club/visualization.chibiclub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate source add-ons
        run: |
          python -m compileall -q sources/ersatztv-kodi/plugin.video.ersatztv
          python -m compileall -q sources/multi-update-kodi/script.multi.update.kodi
          python -m compileall -q sources/radio-generator-kodi/plugin.audio.smartplaylist.radio
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for root in (Path("repository.babaduchi.ersatztv"), Path("sources/ersatztv-kodi/plugin.video.ersatztv"), Path("sources/multi-update-kodi/script.multi.update.kodi"), Path("sources/radio-generator-kodi/plugin.audio.smartplaylist.radio"), Path("sources/chibi-club/visualization.chibiclub")):
              for path in root.rglob("*.xml"):
                  ET.parse(path)
                  print("valid:", path)
          PY
      - name: Build Kodi repository
        run: >-
          python tools/build_kodi_repository.py site
          sources/ersatztv-kodi/plugin.video.ersatztv
          sources/multi-update-kodi/script.multi.update.kodi
          sources/radio-generator-kodi/plugin.audio.smartplaylist.radio
          sources/chibi-club/visualization.chibiclub
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Publish repository installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("repository.babaduchi.ersatztv/addon.xml").getroot().attrib["version"])')
          archive="site/repository.babaduchi.ersatztv/repository.babaduchi.ersatztv-${version}.zip"
          if ! gh release view "v${version}" >/dev/null 2>&1; then
            gh release create "v${version}" --target "$GITHUB_SHA" --title "Babaduchi Kodi Repository ${version}" --notes "Install the attached ZIP in Kodi to receive Babaduchi add-ons and updates."
          fi
          gh release upload "v${version}" "$archive" --clobber
